name: Clear stuck Pages deployment
on:
  push:
    branches: [main]
    paths: [.github/workflows/clear-stuck-pages.yml]
permissions:
  pages: write
  contents: read
jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the timed-out Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/backspin-dev/fitness-tracker/pages/deployments/cfe402bc6ca5c7cb97956504e8eee00906a06fed/cancel"
